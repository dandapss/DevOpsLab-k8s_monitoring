name: Work Flow Practice

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test: 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: test -f Dockerfile

      - name: Show files
        run: ls -la

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Image
        run: docker build -t helm-monitor:test .

      - name: Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helm-monitor:test
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with: 
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dandapss/helm-monitor:1.0.0
            ghcr.io/dandapss/helm-monitor:${{ github.sha }}

      - name: Create File
        run: echo hello > result.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.txt
