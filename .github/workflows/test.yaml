name: Work Flow Practice

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Dockerfile
        run: test -f Dockerfile
      - name: Show files
        run: ls -la

      - name: Build Image
        run: docker build -t helm-monitor:test .
      - name: Build Image-Fail
        if: failure()
        run: echo "build process failed!"
      - name: Security Check
        run: echo "Security Scan"
        
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with: 
          context: .
          push: true
          tags: |
            ghcr.io/dandapss/helm-monitor:latest
            ghcr.io/dandapss/helm-monitor:${{ github.sha }}

      - name: Create File
        run: echo hello > result.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.txt
