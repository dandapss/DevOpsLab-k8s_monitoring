name: Work Flow Practice

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test: 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: test -f Dockerfile

      - name: Show files
        run: ls -la

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Build Image
        run: docker build -t helm-monitor:test .

      - name: Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: helm-monitor:test
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with: 
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dandapss/helm-monitor:latest
            ghcr.io/dandapss/helm-monitor:${{ github.sha }}

      - name: Update image tag
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" kubernetes/values.yaml

      - name: Commit and Push image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/values.yaml
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
          git push

      - name: Create File
        run: echo hello > result.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.txt
