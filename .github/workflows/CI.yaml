name: Work Flow Practice

on:
  push:
    branches:
      - main
    paths:
      - 'src/main.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'kubernetes/**'
      - '.yamllint'
      - '.github/workflows/CI.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.filter.outputs.image == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            image:
              - 'Dockerfile'
              - 'src/main.py'
              - 'requirements.txt'
      - name: Debug filter result
        run: |
          echo "build=${{steps.filter.outputs.image}}"

  manifest:
    needs: changes
    if: always() && needs.changes.result == 'success'

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML Lint
        run: yamllint .

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Check
        run: helm lint kubernetes/helm-monitor

  docker-build:
    needs: 
      - changes
      - manifest
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker Image build
        run: |
          docker build \
          -t ghcr.io/dandapss/helm-monitor:${{ github.sha }} \
          -t ghcr.io/dandapss/helm-monitor:latest \
          .

      - name: Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/dandapss/helm-monitor:${{ github.sha }}
          severity: HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/dandapss/helm-monitor:${{ github.sha }}
          docker push ghcr.io/dandapss/helm-monitor:latest
  
  update-image-tag:
    needs: docker-build
    if: github.ref == 'refs/heads/main' && needs.docker-build.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Update image tag      
      run: |
        sed -i "s/^  tag:.*/  tag: ${{ github.sha }}/" kubernetes/helm-monitor/values.yaml

    - name: Commit and Push image tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add kubernetes/helm-monitor/values.yaml

        if git diff --cached --quiet; then
          exit 0
        fi

        git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
        git push origin HEAD:main

