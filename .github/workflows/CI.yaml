name: Work Flow Practice

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      build: ${{ steps.filter.outputs.build }}

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            build:
              - 'Dockerfile'
              - 'src/*.py'
              - 'requirements.txt'
      - name: Debug filter result
        run: |
          echo "build=${{steps.filter.outputs.build}}"

  docker-build:
    needs: changes
    if: needs.changes.outputs.build == 'true'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Dockerfile
        run: test -f Dockerfile

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Python test
        run: pytest

      - name: Docker Image build
        run: |
          docker build \
          -t ghcr.io/dandapss/helm-monitor:${{ github.sha }} \
          -t ghcr.io/dandapss/helm-monitor:latest \
          .

      - name: Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/dandapss/helm-monitor:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Images
        run: |
          docker push ghcr.io/dandapss/helm-monitor:${{ github.sha }}
          docker push ghcr.io/dandapss/helm-monitor:latest

      - name: Update image tag
        run: |
          sed -i "s/tag: ./tag: ${{ github.sha }}/" kubernetes/helm-monitor/values.yaml

      - name: Commit and Push image tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/helm-monitor/values.yaml
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
          git push

  Manifest:
    needs: docker-build
    if: always()

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: YAML Lint
        run: yamllint .

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Check
        run: helm lint kubernetes/helm-monitor

