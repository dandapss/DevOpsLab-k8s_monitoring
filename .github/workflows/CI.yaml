# Updated 2026-10-09: keep image builds limited to image inputs; validate manifests separately.
name: Kubernetes monitor CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'kubernetes/**'
      - '.github/workflows/CI.yaml'
      - '.yamllint'
  workflow_dispatch:
    inputs:
      build_image:
        description: Build, scan, and publish an image
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push'
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - 'src/**'
              - 'requirements.txt'
            python:
              - 'src/**'
              - 'tests/**'
              - 'requirements.txt'
              - 'Dockerfile'

  python-test:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest

  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yamllint
        run: pip install yamllint
      - name: YAML lint
        run: yamllint .
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint kubernetes/helm-monitor

  docker-build:
    needs: [changes, python-test]
    if: >-
      (github.event_name == 'push' && needs.changes.outputs.image == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_image)
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            -t ghcr.io/dandapss/helm-monitor:${{ github.sha }} \
            -t ghcr.io/dandapss/helm-monitor:latest \
            .
      - name: Trivy vulnerability report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/dandapss/helm-monitor:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          format: table
          # Report-only for now: review compatibility-related HIGH findings before enabling a blocking threshold.
          exit-code: '0'
      - name: Login GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/dandapss/helm-monitor:${{ github.sha }}
          docker push ghcr.io/dandapss/helm-monitor:latest
      - name: Update image tag
        if: github.ref == 'refs/heads/main'
        run: sed -i "s|tag:.*|tag: ${{ github.sha }}|" kubernetes/helm-monitor/values.yaml
      - name: Commit and push image tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/helm-monitor/values.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
            git push
          fi
