apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-monitoring
  namespace: minilab

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-monitoring
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-monitoring
subjects:
  - kind: ServiceAccount
    name: k8s-monitoring
    namespace: minilab
roleRef:
  kind: ClusterRole
  name: k8s-monitoring
  apiGroup: rbac.authorization.k8s.io
