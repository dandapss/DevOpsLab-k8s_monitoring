apiVersion: apps/v1
kind: Deployment
metadata:
  name: testtesttest
spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-test

  template:
    metadata:
      labels:
        app: nginx-test

    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
