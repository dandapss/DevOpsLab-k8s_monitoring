apiVersion: v1
kind: Namespace
metadata:
  name: monitor-test

---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-test

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: monitor-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-test
  namespace: monitor-test
spec:
  selector:
    app: nginx-test
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-test
  namespace: monitor-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-test
  template:
    metadata:
      labels:
        app: redis-test
    spec:
      containers:
        - name: redis
          image: redis:alpine

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-config
  namespace: monitor-test
data:
  environment: lab
  owner: seob

---
apiVersion: v1
kind: Secret
metadata:
  name: sample-secret
  namespace: monitor-test
type: Opaque
data:
  username: dGVzdA==
  password: dGVzdDEyMw==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-test
  namespace: dev-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-test
  template:
    metadata:
      labels:
        app: busybox-test
    spec:
      containers:
        - name: busybox
          image: busybox
          command:
            - sh
            - -c
            - "while true; do sleep 3600; done"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-dev
  namespace: dev-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-dev
  template:
    metadata:
      labels:
        app: nginx-dev
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-dev
  namespace: dev-test
spec:
  selector:
    app: nginx-dev
  ports:
    - port: 80
      targetPort: 80
