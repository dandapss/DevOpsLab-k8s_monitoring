apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helm-monitor
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/dandapss/DevOpsLab-k8s_monitoring.git
    targetRevision: main
    path: kubernetes/helm-monitor

  destination:
    server: https://kubernetes.default.svc
    namespace: helm-monitor

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
